<!-- Navbar — cachée sur login/register -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top"
     *ngIf="showNavbar"
     style="background: linear-gradient(135deg, var(--primary-teal-dark), #1e5f6a); box-shadow: 0 4px 12px rgba(26, 107, 122, 0.3);">
  <div class="container-fluid px-4">

    <a class="navbar-brand d-flex align-items-center gap-2 text-decoration-none" routerLink="/dashboard">
      <svg width="38" height="38" viewBox="0 0 100 100" fill="none">
        <rect x="4" y="4" width="92" height="92" rx="20" fill="rgba(255,255,255,0.2)"/>
        <path d="M50 72 C50 72 24 55 24 37 C24 27 32 20 40 20 C45 20 49 23 50 27 C51 23 55 20 60 20 C68 20 76 27 76 37 C76 55 50 72 50 72Z"
              fill="none" stroke="white" stroke-width="3" stroke-linejoin="round"/>
        <polyline points="28,45 35,45 38,36 41,54 44,40 47,45 53,45 56,36 59,54 62,45 72,45"
                  fill="none" stroke="#7dd8e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="fw-bold fs-5 text-white">LYNORA</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">
            <i class="bi bi-house-door"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/patients" routerLinkActive="active">
            <i class="bi bi-people"></i> Patients
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/rendezvous" routerLinkActive="active">
            <i class="bi bi-calendar-check"></i> RDV
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/ordonnances" routerLinkActive="active">
            <i class="bi bi-file-medical"></i> Ordonnances
          </a>
        </li>
        <li class="nav-item" *ngIf="isAdmin$ | async">
          <a class="nav-link" routerLink="/medecins" routerLinkActive="active">
            <i class="bi bi-person-heart"></i> Médecins
          </a>
        </li>
        <li class="nav-item" *ngIf="isAdmin$ | async">
          <a class="nav-link" routerLink="/specialites" routerLinkActive="active">
            <i class="bi bi-tags"></i> Spécialités
          </a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-3" *ngIf="authService.user$ | async as user">
        <span *ngIf="isAdmin$ | async"
              class="badge d-flex align-items-center gap-1"
              style="background: rgba(255,255,255,0.2); font-size: 0.72rem; padding: 5px 10px;">
          <i class="bi bi-shield-check"></i> Admin
        </span>
        <span *ngIf="isMedecin$ | async"
              class="badge d-flex align-items-center gap-1"
              style="background: rgba(125,216,232,0.3); font-size: 0.72rem; padding: 5px 10px;">
          <i class="bi bi-person-heart"></i> Médecin
        </span>
        <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold text-white"
             style="width:36px;height:36px;background:rgba(255,255,255,0.25);font-size:1rem;flex-shrink:0;">
          {{ getUserInitial(user.email) }}
        </div>
        <span class="text-white opacity-75 d-none d-lg-block small">
          {{ user.email ? user.email.substring(0,20) + (user.email.length > 20 ? '...' : '') : '' }}
        </span>
        <button class="btn btn-outline-light btn-sm" (click)="logout()">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </div>
</nav>

<!-- Spacer — seulement si navbar visible -->
<div *ngIf="showNavbar" style="padding-top: 70px;"></div>

<main [class.fade-in]="showNavbar" [class.px-3]="showNavbar">
  <router-outlet></router-outlet>
</main>
