<!-- Login Polyclinique - Sans navbar -->
<div class="min-vh-100 d-flex">

  <!-- Colonne gauche - fond blanc avec ombre teal -->
  <div class="d-none d-md-flex flex-grow-1 align-items-center justify-content-center p-5"
       style="background: linear-gradient(160deg, #ffffff 0%, #e8f6f9 60%, #c8edf4 100%);
              box-shadow: inset -8px 0 24px rgba(26, 107, 122, 0.08);">
    <div class="d-flex flex-column align-items-center text-center">

      <!-- Grand logo -->
      <svg width="130" height="130" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="4" width="92" height="92" rx="22"
              fill="rgba(42, 157, 181, 0.12)"/>
        <rect x="4" y="4" width="92" height="92" rx="22"
              fill="none" stroke="rgba(26, 107, 122, 0.25)" stroke-width="1.5"/>
        <path d="M50 72 C50 72 24 55 24 37 C24 27 32 20 40 20 C45 20 49 23 50 27 C51 23 55 20 60 20 C68 20 76 27 76 37 C76 55 50 72 50 72Z"
              fill="none" stroke="#1a6b7a" stroke-width="3" stroke-linejoin="round"/>
        <polyline points="28,45 35,45 38,36 41,54 44,40 47,45 53,45 56,36 59,54 62,45 72,45"
                  fill="none" stroke="#2a9db5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <h1 class="fw-bold mt-4 mb-2"
          style="font-size: 2.8rem; letter-spacing: 4px; color: var(--primary-teal-dark);
                 text-shadow: 0 2px 8px rgba(26, 107, 122, 0.15);">
        LYNORA
      </h1>
     <p class="fw-bold mb-2" style="color: var(--primary-teal-dark); opacity: 0.8; font-size: 1.6rem;">
  "Votre santé, notre priorité"
</p>
  

      <!-- Séparateur décoratif -->
      <div class="mt-4" style="width: 60px; height: 3px; background: linear-gradient(135deg, #1a6b7a, #2a9db5); border-radius: 2px;"></div>

      <!-- Info rôles -->
      <div class="mt-4 text-start" style="max-width: 260px;">
        
        
      </div>

    </div>
  </div>

  <!-- Colonne droite - Formulaire -->
  <div class="flex-grow-1 d-flex align-items-center justify-content-center p-4 p-md-5"
       style="background: #f8fafb;">
    <div class="card shadow-lg border-0 fade-in"
         style="max-width: 440px; width: 100%; background: white;
                box-shadow: 0 8px 32px rgba(26, 107, 122, 0.12) !important;">
      <div class="card-body p-5">

        <!-- Header formulaire -->
        <div class="text-center mb-5">
          <div class="mb-3 mx-auto d-flex align-items-center justify-content-center"
               style="width: 58px; height: 58px;
                      background: linear-gradient(135deg, var(--primary-teal-dark), var(--primary-teal-light));
                      border-radius: 14px;
                      box-shadow: 0 4px 12px rgba(26, 107, 122, 0.3);">
            <svg width="34" height="34" viewBox="0 0 100 100" fill="none">
              <path d="M50 72 C50 72 24 55 24 37 C24 27 32 20 40 20 C45 20 49 23 50 27 C51 23 55 20 60 20 C68 20 76 27 76 37 C76 55 50 72 50 72Z"
                    fill="none" stroke="white" stroke-width="4" stroke-linejoin="round"/>
              <polyline points="28,45 35,45 38,36 41,54 44,40 47,45 53,45 56,36 59,54 62,45 72,45"
                        fill="none" stroke="#7dd8e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h2 class="fw-bold mb-1" style="color: var(--text-dark);">Connexion</h2>
          <p class="text-muted small">Accéder à votre espace</p>
        </div>

        <!-- Alert erreur -->
        <div *ngIf="erreur" class="alert alert-danger alert-dismissible fade show" role="alert">
          {{ erreur }}
          <button type="button" class="btn-close" (click)="erreur = ''"></button>
        </div>

        <!-- Formulaire -->
        <form [formGroup]="form" (ngSubmit)="connexion()" novalidate>

          <div class="mb-4">
            <label class="form-label fw-medium small mb-2" style="color: var(--text-dark);">
              Adresse email
            </label>
            <div class="input-group">
              <span class="input-group-text" style="border-right: none; background: #f8fafb;">
                <i class="bi bi-envelope" style="color: var(--primary-teal-light);"></i>
              </span>
              <input type="email" class="form-control" formControlName="email"
                     placeholder="exemple@clinique.com"
                     style="border-left: none; background: #f8fafb;"
                     [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched">
            </div>
            <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched"
                 class="text-danger small mt-1">
              Email valide requis
            </div>
          </div>

          <div class="mb-5">
            <label class="form-label fw-medium small mb-2" style="color: var(--text-dark);">
              Mot de passe
            </label>
            <div class="input-group">
              <span class="input-group-text" style="border-right: none; background: #f8fafb;">
                <i class="bi bi-lock" style="color: var(--primary-teal-light);"></i>
              </span>
              <input type="password" class="form-control" formControlName="password"
                     placeholder="••••••••"
                     style="border-left: none; background: #f8fafb;"
                     [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched">
            </div>
            <div *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
                 class="text-danger small mt-1">
              Mot de passe requis
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-3 fw-semibold"
                  [disabled]="form.invalid || submitting"
                  style="border-radius: 12px; font-size: 1rem;">
            <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2" role="status"></span>
            <i *ngIf="!submitting" class="bi bi-box-arrow-in-right me-2"></i>
            Se connecter
          </button>
        </form>

        <div class="text-center mt-4">
          <a routerLink="/register" class="text-decoration-none small fw-medium"
             style="color: var(--primary-teal-dark);">
            <i class="bi bi-person-plus me-1"></i> Créer un compte
          </a>
        </div>

      </div>
    </div>
  </div>

</div>
