<!-- Register Polyclinique -->
<div class="min-vh-100 d-flex" style="background: linear-gradient(135deg, var(--primary-teal-dark) 0%, #2a9db5 100%);">

  <!-- Colonne gauche -->
  <div class="d-none d-md-flex flex-grow-1 align-items-center justify-content-center p-5 text-white"
       style="background: rgba(255,255,255,0.08);">
    <div class="d-flex flex-column align-items-center text-center">
      <svg width="140" height="140" viewBox="0 0 100 100" fill="none">
        <rect x="4" y="4" width="92" height="92" rx="22" fill="rgba(255,255,255,0.15)"/>
        <rect x="4" y="4" width="92" height="92" rx="22" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
        <path d="M50 72 C50 72 24 55 24 37 C24 27 32 20 40 20 C45 20 49 23 50 27 C51 23 55 20 60 20 C68 20 76 27 76 37 C76 55 50 72 50 72Z"
              fill="none" stroke="white" stroke-width="3" stroke-linejoin="round"/>
        <polyline points="28,45 35,45 38,36 41,54 44,40 47,45 53,45 56,36 59,54 62,45 72,45"
                  fill="none" stroke="#7dd8e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1 class="fw-bold mt-4 mb-2" style="font-size: 3rem; letter-spacing: 4px; color: white; text-shadow: 0 4px 12px rgba(0,0,0,0.3);">
        LYNORA
      </h1>
      <p class="lead mb-2 opacity-90">"Votre santé, notre priorité"</p>
      <div class="mt-4 text-start" style="max-width: 280px;">
        <div class="d-flex align-items-center gap-2 mb-2 opacity-90">
          <i class="bi bi-shield-check"></i>
          <span class="small"><strong>Admin</strong> — Accès complet à tout</span>
        </div>
        <div class="d-flex align-items-center gap-2 opacity-90">
          <i class="bi bi-person-heart"></i>
          <span class="small"><strong>Médecin</strong> — Patients, RDV, Ordonnances</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Colonne droite -->
  <div class="flex-grow-1 d-flex align-items-center justify-content-center p-5">
    <div class="card shadow-lg border-0 fade-in" style="max-width: 450px; width: 100%; background: white;">
      <div class="card-body p-5">

        <div class="text-center mb-4">
          <div class="mb-3 mx-auto d-flex align-items-center justify-content-center"
               style="width: 60px; height: 60px; background: linear-gradient(135deg, var(--primary-teal-dark), var(--primary-teal-light)); border-radius: 14px;">
            <svg width="36" height="36" viewBox="0 0 100 100" fill="none">
              <path d="M50 72 C50 72 24 55 24 37 C24 27 32 20 40 20 C45 20 49 23 50 27 C51 23 55 20 60 20 C68 20 76 27 76 37 C76 55 50 72 50 72Z"
                    fill="none" stroke="white" stroke-width="4" stroke-linejoin="round"/>
              <polyline points="28,45 35,45 38,36 41,54 44,40 47,45 53,45 56,36 59,54 62,45 72,45"
                        fill="none" stroke="#7dd8e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h2 class="fw-bold mb-1" style="color: var(--text-dark);">Créer un compte</h2>
          <p class="text-muted small">Choisissez votre rôle ci-dessous</p>
        </div>

        <div *ngIf="erreur" class="alert alert-danger alert-dismissible fade show">
          {{ erreur }}
          <button type="button" class="btn-close" (click)="erreur = ''"></button>
        </div>

        <form [formGroup]="form" (ngSubmit)="inscription()" novalidate>

          <div class="mb-3">
            <label class="form-label fw-medium small">Adresse email *</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" formControlName="email"
                     placeholder="exemple@clinique.com"
                     [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched">
            </div>
            <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="text-danger small mt-1">
              Email valide requis
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-medium small">Mot de passe *</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" formControlName="password"
                     placeholder="Minimum 6 caractères"
                     [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched">
            </div>
            <div *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="text-danger small mt-1">
              Minimum 6 caractères
            </div>
          </div>

          <!-- Sélection rôle -->
          <div class="mb-4">
            <label class="form-label fw-medium small">Rôle *</label>
            <div class="row g-2">
              <div class="col-6">
                <input type="radio" class="btn-check" formControlName="role" value="admin" id="roleAdmin">
                <label class="btn btn-outline-secondary w-100 d-flex flex-column align-items-center py-3"
                       for="roleAdmin" style="border-radius: 12px; cursor: pointer; transition: all 0.2s;">
                  <i class="bi bi-shield-check fs-4 mb-1" style="color: var(--primary-teal-dark);"></i>
                  <span class="fw-medium small">Administrateur</span>
                  <span class="text-muted" style="font-size: 0.7rem;">Accès complet</span>
                </label>
              </div>
              <div class="col-6">
                <input type="radio" class="btn-check" formControlName="role" value="medecin" id="roleMedecin">
                <label class="btn btn-outline-secondary w-100 d-flex flex-column align-items-center py-3"
                       for="roleMedecin" style="border-radius: 12px; cursor: pointer; transition: all 0.2s;">
                  <i class="bi bi-person-heart fs-4 mb-1" style="color: var(--primary-teal-light);"></i>
                  <span class="fw-medium small">Médecin</span>
                  <span class="text-muted" style="font-size: 0.7rem;">Accès limité</span>
                </label>
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-3 fw-semibold"
                  [disabled]="form.invalid || submitting">
            <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2"></span>
            Créer mon compte
          </button>
        </form>

        <div class="text-center mt-4">
          <a routerLink="/login" class="text-decoration-none fw-medium" style="color: var(--primary-teal-dark);">
            <i class="bi bi-arrow-left"></i> Retour connexion
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
