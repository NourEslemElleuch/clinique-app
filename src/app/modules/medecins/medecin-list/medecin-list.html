<div class="container-fluid px-4 py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-person-heart"></i> Liste des médecins</h2>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#medecinModal">
      <i class="bi bi-plus-circle"></i> Ajouter médecin
    </button>
  </div>

  <!-- Recherche -->
  <div class="row mb-4">
    <div class="col-md-6">
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="text" class="form-control" placeholder="Rechercher médecin..."
               [(ngModel)]="recherche">
      </div>
    </div>
  </div>

  <!-- Loader -->
  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Chargement...</span>
    </div>
  </div>

  <!-- Tableau -->
  <div *ngIf="!loading" class="table-responsive">
    <table class="table table-hover">
      <thead class="table-dark">
        <tr>
          <th>Nom</th>
          <th>Prénom</th>
          <th>Email</th>
          <th>Téléphone</th>
          <th>Spécialité</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let medecin of filteredMedecins">
          <td>{{ medecin.nom }}</td>
          <td>{{ medecin.prenom }}</td>
          <td>{{ medecin.email }}</td>
          <td>{{ medecin.telephone }}</td>
          <td>
            <span class="badge bg-info">{{ getSpecialiteNom(medecin.specialiteId) }}</span>
          </td>
          <td>
            <button class="btn btn-sm btn-outline-primary me-1"
                    data-bs-toggle="modal" data-bs-target="#medecinModal">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" (click)="delete(medecin.id!, medecin.nom!)">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="filteredMedecins.length === 0" class="text-center py-5 text-muted">
      <i class="bi bi-person-x display-1 opacity-25"></i>
      <p>Aucun médecin trouvé</p>
    </div>
  </div>
</div>

<!-- Modal -->
<app-medecin-form></app-medecin-form>
